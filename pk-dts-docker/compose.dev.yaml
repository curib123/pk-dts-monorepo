name: pk-dms-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pk-dms-dev-postgres:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build:
      context: ../pk-dts-backend
      dockerfile: Dockerfile.dev
    command:
      [
        "sh",
        "-c",
        "node scripts/prisma-env.js generate && node scripts/prepare-postgres-startup.js && node scripts/prisma-db-push-retry.js && npm run prisma:seed && npm run start:dev",
      ]
    init: true
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      NODE_ENV: development
      APP_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PROVIDER: postgresql
      PRISMA_SCHEMA_PATH: prisma/schema.postgresql.prisma
      DATABASE_URL: ${DATABASE_URL}
      APP_BASE_URL: http://localhost:3400
      UPLOAD_BASE_URL: http://localhost:3401
      BACKUP_RESTORE_DIR: /app/backup-store
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # The whole backend source tree is bind-mounted. A git pull updates /app
      # immediately and Nest's watch mode recompiles/restarts without an image rebuild.
      - ../pk-dts-backend:/app
      - backend_node_modules:/app/node_modules
      - pk-dms-dev-backups:/app/backup-store
      - pk-dms-dev-uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-3401}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http = require('http'); const req = http.get('http://127.0.0.1:3000/api/v1/health', (res) => { res.resume(); process.exit(res.statusCode >= 200 && res.statusCode < 300 ? 0 : 1); }); req.setTimeout(4000, () => { req.destroy(new Error('timeout')); process.exit(1); }); req.on('error', () => process.exit(1));\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 128mb, --maxmemory-policy, allkeys-lru]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  frontend:
    build:
      context: ../pk-dts-frontend
      dockerfile: Dockerfile.dev
    # Keep live reload on Windows bind mounts while reducing full-tree polling churn.
    command: ["npm", "start", "--", "--host", "0.0.0.0", "--port", "4200", "--poll", "1000", "--hmr"]
    init: true
    restart: unless-stopped
    environment:
      BACKEND_API_BASE_URL: ${DEV_PUBLIC_API_URL:-http://localhost:3401/api/v1}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
      WATCHPACK_POLLING: "true"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      # The whole frontend source tree is bind-mounted. Angular polls the mount,
      # so branch switches and git pull updates are picked up automatically.
      - ../pk-dts-frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_angular_cache:/app/.angular
    ports:
      - "${FRONTEND_PORT:-3400}:4200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http = require('http'); const req = http.get('http://127.0.0.1:4200/', (res) => { res.resume(); process.exit(res.statusCode >= 200 && res.statusCode < 400 ? 0 : 1); }); req.setTimeout(4000, () => { req.destroy(new Error('timeout')); process.exit(1); }); req.on('error', () => process.exit(1));\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  pk-dms-dev-postgres:
  pk-dms-dev-backups:
  pk-dms-dev-uploads:
  backend_node_modules:
  frontend_node_modules:
  frontend_angular_cache:
