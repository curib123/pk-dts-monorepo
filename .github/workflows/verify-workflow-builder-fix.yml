name: Verify workflow builder loading fix

on:
  pull_request:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pk-dts-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pk-dts-frontend/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test -- --watch=false --browsers=ChromeHeadless

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pk-dts-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pk-dts-backend/package-lock.json
      - run: npm ci
      - name: Generate PostgreSQL Prisma client
        run: node scripts/prisma-env.js generate
        env:
          PRISMA_SCHEMA_PATH: prisma/schema.postgresql.prisma
      - run: npm run build
      - run: npm test
